# Production : l'application + sa base PostgreSQL.
#
# Déploiement Coolify (type « Docker Compose ») derrière nginx installé sur le serveur :
#   - le port 3000 est publié en local sur 127.0.0.1:3003 pour nginx (pas d'accès direct depuis Internet) ;
#   - BETTER_AUTH_URL doit être défini dans Coolify avec le domaine public en https.
#
# Ailleurs (docker compose -f docker-compose.prod.yml up --build) : définir dans un fichier .env
#   POSTGRES_PASSWORD, BETTER_AUTH_SECRET (openssl rand -base64 32) et BETTER_AUTH_URL.
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://chc:${POSTGRES_PASSWORD:-${SERVICE_PASSWORD_DBPASSWORD}}@db:5432/chc
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-${SERVICE_PASSWORD_64_AUTHSECRET}}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${SERVICE_URL_APP_3000}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3003:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: chc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${SERVICE_PASSWORD_DBPASSWORD}}
      POSTGRES_DB: chc
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chc -d chc"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-data: