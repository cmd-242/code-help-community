# Production : l'application + sa base PostgreSQL.
#
# Sur Coolify (type « Docker Compose », fichier docker-compose.prod.yml) : rien à saisir.
#   Le domaine, le mot de passe de la base et le secret d'authentification sont générés
#   par Coolify. Assigne ton domaine au service « app » dans l'interface ; BETTER_AUTH_URL
#   suit automatiquement. Variables facultatives : GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET.
#
# Ailleurs (docker compose -f docker-compose.prod.yml up --build) : définis dans un fichier .env
#   POSTGRES_PASSWORD, BETTER_AUTH_SECRET (openssl rand -base64 32) et BETTER_AUTH_URL.
#
# Le développement local utilise docker-compose.yml (Postgres + MinIO).
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Coolify remplit SERVICE_* tout seul (domaine, mots de passe) ; ailleurs, définis les trois variables du haut.
      DATABASE_URL: postgresql://chc:${POSTGRES_PASSWORD:-${SERVICE_PASSWORD_DBPASSWORD}}@db:5432/chc
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-${SERVICE_PASSWORD_64_AUTHSECRET}}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${SERVICE_URL_APP_3000}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: chc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${SERVICE_PASSWORD_DBPASSWORD}}
      POSTGRES_DB: chc
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chc -d chc"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-data:
